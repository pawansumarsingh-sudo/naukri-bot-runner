
name: Naukri Bot - Deployment Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naukri-bot
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout private BOT repository
        uses: actions/checkout@v4
        with:
          repository: pawansumarsingh-sudo/BOT
          ref: FULL-CODE
          token: ${{ secrets.BOT_ACCESS_TOKEN }}
          path: bot

      - name: Restore bot state
        uses: actions/cache@v4
        with:
          path: |
            bot/data/state.json
            bot/data/applied_job_ids.json
          key: naukri-state-${{ github.run_id }}
          restore-keys: |
            naukri-state-

      - name: Ensure state files exist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "bot/data" | Out-Null

          if (-not (Test-Path "bot/data/state.json")) {
            Set-Content "bot/data/state.json" "{}"
          }

          if (-not (Test-Path "bot/data/applied_job_ids.json")) {
            Set-Content "bot/data/applied_job_ids.json" "[]"
          }

          Write-Host "Bot state files are ready."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r bot/requirements.txt

      - name: Verify application files
        shell: pwsh
        run: |
          $required = @(
            "naukri_bot.py",
            "requirements.txt",
            "config.ini"
          )

          foreach ($file in $required) {
            if (-not (Test-Path "bot/$file")) {
              throw "Missing required file: $file"
            }
            Write-Host "Found: $file"
          }

          python --version
          python -m pip show selenium
          python -m pip show anthropic

      - name: Verify Chrome installation
        shell: pwsh
        run: |
          $paths = @(
            "${env:ProgramFiles}\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
          )

          $found = $false
          foreach ($path in $paths) {
            if (Test-Path $path) {
              Write-Host "Chrome found: $path"
              $found = $true
              break
            }
          }

          if (-not $found) {
            throw "Chrome is not installed."
          }

      - name: Test Selenium with Chrome
        shell: pwsh
        run: |
          @'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")

          driver = webdriver.Chrome(options=options)

          try:
              driver.get("https://www.google.com")
              print("Page title:", driver.title)
              print("Selenium Chrome test passed.")
          finally:
              driver.quit()
          '@ | Set-Content selenium_test.py

          python selenium_test.py
